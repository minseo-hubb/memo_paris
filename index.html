
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo Paris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">

        <!-- 상단 메뉴 -->
        <header class="header">
            <nav class="nav">
                <a href="#">HOME</a>
                <a href="#">SHOP</a>
                <a href="#">DISCOVER</a>
                <a href="#">ART</a>
                <a href="#">ABOUT US</a>
            </nav>

            <div class="user-menu">
                내 계정&nbsp; 장바구니&nbsp; … (아이콘)
            </div>
        </header>

        <!-- 브랜드 로고 -->
        <section class="brand">
            <h1>Memo<br>Paris</h1>
            <img src="./메모파리로고.png" alt="메모파리로고">
        </section>

        <!-- 메인 이미지 -->
        <section class="main-image placeholder">
            <img src="./파리야경.jpg" alt="파리야경">
            <span>(메인이미지)</span>
        </section>

        <!-- 여백 -->
        <div class="section-space"></div>

        <!-- 콜라보 / 제품 이미지 -->
        <section class="two-images">
            <div class="collab-image placeholder">
                <p>사진2</p>
                <span>(콜라보 사진)</span>
            </div>

            <div class="product-image placeholder">
                <p>사진3</p>
                <span>(제품 컷)</span>
            </div>
        </section>

        <!-- 브랜드 소개 -->
        <section class="brand-story">

            <div class="story-image placeholder">
                <p>사진4</p>
                <span>(브랜드 이미지를 보여주는 사진)</span>
            </div>

            <div class="story-text">
                <h2>브랜드 철학</h2>
                <p>
                    브랜드의 철학과 가치에 대한 설명을 넣는 영역입니다.
                    메모 파리의 여행과 향수에 대한 이야기를 소개합니다.
                </p>
            </div>

        </section>

        <!-- 하단 이미지 8개 -->
        <section class="image-gallery">

            <div class="gallery-image placeholder">사진5</div>
            <div class="gallery-image placeholder">사진6</div>
            <div class="gallery-image placeholder">사진7</div>
            <div class="gallery-image placeholder">사진8</div>

            <div class="gallery-image placeholder">사진9</div>
            <div class="gallery-image placeholder">사진10</div>
            <div class="gallery-image placeholder">사진11</div>
            <div class="gallery-image placeholder">사진12</div>

        </section>

        <!-- 하단 로고 -->
        <footer class="footer">
            <h2>Memo<br>Paris</h2>
        </footer>

    </main>

</body>
</html>
